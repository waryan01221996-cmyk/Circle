name: Febspot Referral Bot

on:
  schedule:
    - cron: '0 * * * *' # Berjalan setiap jam secara otomatis
  workflow_dispatch:      # Tombol manual untuk menjalankan bot

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Bot
      run: python bot.py
